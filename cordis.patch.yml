# =============================================================================
# dsh-remote-cluster — 集群清单 / 配置层
#
# 本层只做一件事：把 base 的中性默认 `remote-hosts-ssh: hosts: []` 换成
# 「由环境变量供给的集群清单」，并原样重述 base 的三个默认值。
#
# 层位：out-of-tree bundle 由 reconcile 追加到 `dsh.profile.bundles` 末尾，
# 因此在 in-box bundle（dsh-base / dsh-web-app）之后生效，同 id 行后者胜
# （vendor/include/src/index.ts:110-124）；用户自己的 profile patch 仍在本层之上。
#
# 本层刻意不做的事：
#   * 不 insert 任何 in-box 已存在的行 id —— include 的 insert 不去重 id
#     （vendor/include/src/index.ts:94），重复 id 会让两个 provider 抢同一注册表。
#   * 不声明 `tool-remote-host`：base 启用它，web-app 故意 `disabled: true`
#     （packages/bundle/web-app/cordis.patch.yml:351-352）并改由 standard preset 启用
#     （packages/preset/agent-presets/presets/standard/agent.cordis.yml:78-79）。
#     本层若声明它会把那个 disabled 覆盖回来，破坏 web profile 的既定设计。
#
# config 是「整体替换」而非 merge（vendor/include/src/index.ts:121-124），
# 所以 base 那三个键必须在下面原样重述，否则会被清成 schema 默认值。
#
# `!!js` 三元表达式必须加引号：不加引号时表达式里的 ": " 会被 YAML 当成键分隔符，
# 配置被静默解析成一个 mapping（不报错，属于最难排查的一类问题）。单引号与双引号等价。
# 仓库内先例共两处、都是双引号：packages/bundle/base/cordis.patch.yml:250 与
# packages/bundle/sdk-app/cordis.patch.yml:21；本包用单引号，语义等价。
# 对照：base/cordis.patch.yml:239 的 `disabled: !!js process.platform === 'win32'` 未加引号且不是三元，不适用本条。
# =============================================================================
- id: remote-hosts-ssh
  name: '@deepseek-ai/dsh-host-remote-host-ssh'
  config:
    # 集群清单来自环境变量（JSON 数组），未设置或为空则回落 []（即 base 的中性默认），
    # 因此仓库里不硬编码任何真实集群。每台的认证材料永远不进这里 ——
    # 私钥走 identityFile / agentSocket，密码走凭据库与 settings。
    hosts: !!js 'process.env.DSH_REMOTE_CLUSTER_HOSTS ? JSON.parse(process.env.DSH_REMOTE_CLUSTER_HOSTS) : []'
    # 以下三键与 base 保持一致（见 packages/bundle/base/cordis.patch.yml:96-99）：
    # password-only 目标走 OpenSSH ControlMaster，保留 900s（对齐原版 HSAgent ControlPersist=900s）。
    passwordControlMaster: true
    controlPersistSeconds: 900
    maxTransferBytes: 268435456
